<!DOCTYPE html>
<html>
<head>
    <title>CGI POST Test</title>
</head>
<body>
    <h1>POST Request to CGI</h1>
    <form method="POST" action="http://localhost:8080/cgi-bin/test.py">
        <label for="name_input">名前 (name):</label>
        <input type="text" id="name_input" name="name" value="PostUser"><br><br>
        
        <label for="message_input">メッセージ:</label>
        <input type="text" id="message_input" name="message" value="Test message"><br><br>
        
        <input type="submit" value="POSTデータをCGIに送信">
    </form>
</body>
</html>
