http {
    server {
        listen 8080;

        # カスタムエラーページ
        error_page 404 /404.html;

        # クライアントボディ制限
        client_max_body_size 10m;

        # 基本のルートディレクトリ
        root docs/html;
        index index8080.html;

        # 1. 基本ルート
        location / {
            allow_methods GET POST DELETE;
            autoindex off;
        }

        location /img {
            root docs;
            index icon.jpeg;
        }

        # 2. Autoindex確認用
        location /directory {
            allow_methods GET HEAD;
            root docs;
            autoindex on;
        }

        # 3. リダイレクト確認用
        location /redirect {
            return https://www.google.com/;
        }

        # 4. CGI確認用
        location /cgi-bin {
            root ./docs;
            allow_methods GET POST HEAD;
            cgi_path /usr/bin/python3;
            cgi_extension .py;
        }

        # 5. アップロード確認用
        location /upload {
            allow_methods POST DELETE;
            root docs;
            upload_store docs/upload;
        }

        # 6. DELETEテスト用
        location /delete_test {
             allow_methods DELETE;
             root docs;
        }

        # 7. ボディサイズ制限テスト用
        location /limit_test {
            allow_methods POST;
            client_max_body_size 10;
            upload_store docs/upload;
        }
    }

    server {
        listen 8081;

        root docs/html;
        index index8081.html;

        location / {
            allow_methods GET;
        }

        location /img {
            root docs;
            index 1MB.jpg;
        }
    }

# port が重複してるときは動かない
    # server {
    #     listen 8080;
    # }
}
