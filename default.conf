http {
	server {
		listen 8080;
		server_name localhost;
		root ./docs/html;
		index index.html;

		error_page 404 /404.html;#2.error_pageの設定


		client_max_body_size 1024;#3.ボディサイズの制限

		location / {#4．root
			allow_methods GET POST;
			autoindex on;
		}

		location /img {#4．ディレクトリの設定
			root ./docs/img;#別ディレクトリ割当
			index icon.jpeg;#デフォルトファイルの設定
			allow_methods GET;#　GETのみ許可
		}

		location /delete_test{#5.methodの設定
			root ./docs/trash;
			allow_methods DELETE;
		}

		location /cgi-bin {#6.CGIの設定
			root ./;
			allow_methods GET POST;
			cgi_extension .py;
			cgi_path /usr/bin/python3;
		}

		location /redirect {
			return 301 http://google.com;
		}

		location  /upload {#7. 
			root ./docs/upload;

			upload_store ./docs/upload;

			allow_methods POST DELETE;
		}
	}

	#1.異なるportで複数サーバ検証
	#port8081
	server {
		listen 8081;
		server_name localhost;
		root ./docs/html;
		index index8081.html;

		location / {
            root ./docs/html;      # ここに書く
            index index8081.html;  # ここに書く
            allow_methods GET;     # 必要ならメソッド許可も
            autoindex on; 
        }
	}

	# server {
	# 	listen 8080;
	# 	server_name test.com; #curl -H "Host: test.com" localhost:8080 でアクセス
	# 	root ./docs/site_test; #"Virtural Host" と書いたindex.htmlを書いておく
	# 	index index.html;///今回はvirtualHostは機能しないが丸
	# }
}

# 1.portとインターフェース・異なるportで複数サーバー・同じportで異なるサーバー名を設定
# 2.エラーページ・デフォルトのエラーページを設定特に404
# 3.ボディサイズの制限・クライアントのリクエストボディサイズを制限(client_max_body_size)
# 4.rootとディレクトリ設定・特定のディレクトリへのルート(location)を設定・ディレクトリリクエスト時のデフォルトファイル(index)を設定。
# 5.メソッド制限・特定のルートで使用できるメゾット(GET,POST,DELETE)を制限する。
# 6.CGI設定・CGIを実行するための設定(拡張子やパスなど)
# 7．アップロードファイルをアップロードできる場所の設定(保存先など)



