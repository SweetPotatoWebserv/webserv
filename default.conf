http {
    server {
        listen 0.0.0.0:8080;
        location / {
            root docs/html/;
            index index.html;
        }

        location /img {
            root docs/img/;
            index icon.jpeg;
        }

        location /cgi-bin/ {
            root ./; 
            cgi_extension .py; 
            cgi_path /usr/bin/python3; 
            allow_methods GET POST HEAD DELETE; 
        }
    }
}
