http {
    # Server 1: メイン (Port 8080)
    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        # カスタムエラーページ (docs/html/404.htmlを表示)
        error_page 404 /404.html;

        # クライアントボディ制限 (通常は10MB)
        client_max_body_size 10m;

        # 基本のルートディレクトリ
        root docs/html;
        index index.html;

        # 1. 基本ルート
        location / {
            allow_methods GET POST DELETE;
            autoindex off;
        }

        # 2. Autoindex確認用
        # URL: /directory -> パス: docs/html/directory
        location /directory {
            allow_methods GET DELETE;
            root docs/html;  # root + URL(/directory) = docs/html/directory
            autoindex on;
        }

        # 3. リダイレクト確認用
        location /redirect {
            return 301 http://localhost:8080/;
        }

        # 4. CGI確認用
        # URL: /cgi-bin -> パス: docs/cgi-bin
        location /cgi-bin {
            root docs;      # root(docs) + URL(/cgi-bin) = docs/cgi-bin
            allow_methods GET POST;
            index time.py;
            cgi_path /usr/bin/python3;
            cgi_extension .py;
        }

        # 5. アップロード確認用
        location /upload {
            allow_methods POST;
            root docs/html;
            upload_store docs/upload;
        }

        # 6. ボディサイズ制限テスト用 (ここだけ100バイト制限)
        location /limit_test {
            allow_methods POST;
            client_max_body_size 100;
        }
    }

    # Server 2: ポート違い (Port 8081)
    server {
        listen 8081;
        server_name localhost;

        # docs/html 以下の index8081.html を表示させる設定
        # (index8081.htmlを index.htmlとして扱いたい場合の設定例)
        # もしくは単純に root docs/html; index index8081.html; でもOK
        root docs/html;
        index index8081.html;

        location / {
            allow_methods GET;
        }
    }

    # Server 3: バーチャルホスト (Port 8080, example.com)
    # server {
    #     listen 8080;
    #     server_name example.com;

    #     # ここは専用のフォルダを見るようにする
    #     root docs/virtual;
    #     index index.html;

    #     location / {
    #         allow_methods GET;
    #     }
    # }
}
